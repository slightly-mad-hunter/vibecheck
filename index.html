<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a0533">
<title>✨ Vibe Check Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0020;
    --surface: #1e0040;
    --surface2: #2a0058;
    --card: #1a0035;
    --border: rgba(255,255,255,0.08);
    --text: #f0e8ff;
    --muted: rgba(240,232,255,0.5);
    --pink: #ff4d9e;
    --orange: #ff7b3d;
    --yellow: #ffd23f;
    --cyan: #00e5cc;
    --purple: #c084fc;
    --blue: #60a5fa;
    --green: #4ade80;
    --red: #f87171;
    --grad1: linear-gradient(135deg, #ff4d9e, #c084fc);
    --grad2: linear-gradient(135deg, #ff7b3d, #ffd23f);
    --grad3: linear-gradient(135deg, #00e5cc, #60a5fa);
    --grad4: linear-gradient(135deg, #4ade80, #00e5cc);
    --grad5: linear-gradient(135deg, #c084fc, #60a5fa);
    --grad6: linear-gradient(135deg, #ffd23f, #ff7b3d);
    --grad7: linear-gradient(135deg, #ff4d9e, #ff7b3d);
    --radius: 20px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Quicksand', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overflow-x: hidden;
    padding-bottom: 90px;
    line-height: 1.5;
    letter-spacing: 0.01em;
  }

  /* NOISE TEXTURE */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  /* ORB BACKGROUNDS */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    pointer-events: none;
    z-index: 0;
    animation: orbFloat 8s ease-in-out infinite;
  }
  .orb1 { width: 400px; height: 400px; background: #ff4d9e; top: -100px; left: -100px; animation-delay: 0s; }
  .orb2 { width: 300px; height: 300px; background: #c084fc; top: 30%; right: -80px; animation-delay: 2s; }
  .orb3 { width: 350px; height: 350px; background: #00e5cc; bottom: 20%; left: -60px; animation-delay: 4s; }

  @keyframes orbFloat {
    0%, 100% { transform: translateY(0px) scale(1); }
    50% { transform: translateY(-20px) scale(1.05); }
  }

  /* HEADER */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 16px 20px 12px;
    background: rgba(15,0,32,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .app-title {
    font-family: 'Quicksand', sans-serif;
    font-weight: 800;
    font-size: 22px;
    background: var(--grad1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .date-pill {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    background: var(--surface);
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  /* VIEWS */
  .view { display: none; padding: 16px 16px 0; position: relative; z-index: 1; }
  .view.active { display: block; }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 200;
    background: rgba(15,0,32,0.92);
    backdrop-filter: blur(24px);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 0 env(safe-area-inset-bottom);
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 4px;
    cursor: pointer;
    border: none;
    background: none;
    color: var(--muted);
    font-family: 'Quicksand', sans-serif;
    font-size: 10px;
    font-weight: 500;
    transition: color 0.2s;
  }
  .nav-item.active { color: var(--pink); }
  .nav-item .nav-icon { font-size: 20px; }
  .nav-item.active .nav-icon {
    filter: drop-shadow(0 0 6px currentColor);
  }

  /* CARDS */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .card.pink::before { background: var(--grad1); }
  .card.orange::before { background: var(--grad2); }
  .card.cyan::before { background: var(--grad3); }
  .card.green::before { background: var(--grad4); }
  .card.purple::before { background: var(--grad5); }
  .card.yellow::before { background: var(--grad6); }
  .card.coral::before { background: var(--grad7); }

  .card-title {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title span { font-size: 18px; }

  /* SECTION LABEL */
  .section-label {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    margin-top: 6px;
  }

  /* FORM ELEMENTS */
  .field-row { margin-bottom: 14px; }
  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type="number"], input[type="text"], input[type="time"], select, textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    padding: 11px 14px;
    font-family: 'Quicksand', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
    appearance: none;
  }
  input:focus, select:focus, textarea:focus {
    border-color: rgba(192,132,252,0.5);
    box-shadow: 0 0 0 3px rgba(192,132,252,0.1);
  }
  select option { background: #1a0035; }
  textarea { resize: none; min-height: 80px; }

  .input-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  /* SLIDER */
  .slider-wrap { position: relative; }
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: var(--surface2);
    border: none;
    padding: 0;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--grad1);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(255,77,158,0.5);
  }
  .slider-val {
    text-align: right;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--pink);
  }

  /* PILL TOGGLES */
  .pill-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    padding: 7px 14px;
    border-radius: 30px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .pill.selected { background: var(--surface2); color: var(--text); border-color: var(--pink); box-shadow: 0 0 10px rgba(255,77,158,0.3); }
  .pill.selected.cyan { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,229,204,0.3); }
  .pill.selected.orange { border-color: var(--orange); box-shadow: 0 0 10px rgba(255,123,61,0.3); }
  .pill.selected.yellow { border-color: var(--yellow); box-shadow: 0 0 10px rgba(255,210,63,0.3); }
  .pill.selected.green { border-color: var(--green); box-shadow: 0 0 10px rgba(74,222,128,0.3); }

  /* SAVE BUTTON */
  .save-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--grad1);
    color: #fff;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.5px;
    cursor: pointer;
    margin-top: 6px;
    box-shadow: 0 4px 20px rgba(255,77,158,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .save-btn:active { transform: scale(0.97); box-shadow: 0 2px 10px rgba(255,77,158,0.3); }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--grad1);
    color: #fff;
    padding: 12px 24px;
    border-radius: 30px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 14px;
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(255,77,158,0.5);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* DASHBOARD */
  .dash-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }
  .dash-tile {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 14px;
    position: relative;
    overflow: hidden;
    min-height: 100px;
  }
  .dash-tile-icon { font-size: 28px; margin-bottom: 6px; }
  .dash-tile-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .dash-tile-val {
    font-family: 'Quicksand', sans-serif;
    font-weight: 800;
    font-size: 20px;
    line-height: 1.1;
  }
  .dash-tile-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .dash-tile::after {
    content: '';
    position: absolute;
    bottom: -20px; right: -20px;
    width: 80px; height: 80px;
    border-radius: 50%;
    opacity: 0.08;
  }
  .dash-tile.pink::after { background: var(--pink); }
  .dash-tile.orange::after { background: var(--orange); }
  .dash-tile.cyan::after { background: var(--cyan); }
  .dash-tile.green::after { background: var(--green); }
  .dash-tile.purple::after { background: var(--purple); }
  .dash-tile.yellow::after { background: var(--yellow); }

  /* STREAK BANNER */
  .streak-banner {
    background: var(--grad7);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .streak-num {
    font-family: 'Quicksand', sans-serif;
    font-weight: 800;
    font-size: 42px;
    line-height: 1;
    color: #fff;
  }
  .streak-text { flex: 1; }
  .streak-text strong { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 15px; display: block; }
  .streak-text span { font-size: 12px; opacity: 0.85; }

  /* CALENDAR */
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-nav {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 16px;
    color: var(--text);
  }
  .cal-month {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 17px;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
  .cal-dow {
    text-align: center;
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    padding: 4px 0;
    text-transform: uppercase;
  }
  .cal-day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    position: relative;
    color: var(--muted);
    transition: all 0.15s;
  }
  .cal-day.has-data { color: var(--text); background: var(--surface); }
  .cal-day.today { background: var(--grad1) !important; color: #fff !important; font-weight: 700; box-shadow: 0 0 12px rgba(255,77,158,0.5); }
  .cal-day .dot {
    position: absolute;
    bottom: 3px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--cyan);
  }
  .cal-day.other-month { opacity: 0.25; }

  /* CHARTS */
  .chart-container { width: 100%; overflow-x: auto; padding-bottom: 6px; }
  canvas { display: block; }

  /* LOG LIST */
  .log-list { display: flex; flex-direction: column; gap: 10px; }
  .log-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 13px 15px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .log-icon { font-size: 22px; flex-shrink: 0; margin-top: 1px; }
  .log-content { flex: 1; min-width: 0; }
  .log-title { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
  .log-detail { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log-time { font-size: 11px; color: var(--muted); flex-shrink: 0; }

  /* ASTRO */
  .astro-banner {
    background: var(--grad5);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 14px;
    text-align: center;
  }
  .astro-sign { font-size: 52px; margin-bottom: 6px; }
  .astro-title { font-family: 'Quicksand', sans-serif; font-weight: 800; font-size: 20px; color: #fff; margin-bottom: 4px; }
  .astro-sub { font-size: 13px; opacity: 0.85; color: #fff; }

  .moon-phase-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 6px;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .moon-phase-row::-webkit-scrollbar { display: none; }
  .moon-tile {
    flex-shrink: 0;
    width: 70px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 6px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .moon-tile.current { border-color: var(--purple); background: var(--surface2); box-shadow: 0 0 12px rgba(192,132,252,0.3); }
  .moon-tile-emoji { font-size: 26px; margin-bottom: 4px; }
  .moon-tile-name { font-size: 9px; color: var(--muted); font-weight: 500; }
  .moon-tile-date { font-size: 9px; color: var(--muted); margin-top: 2px; }

  .energy-gauge {
    background: var(--surface);
    border-radius: 50px;
    height: 12px;
    position: relative;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .energy-fill {
    height: 100%;
    border-radius: 50px;
    background: var(--grad5);
    transition: width 0.6s ease;
  }
  .energy-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
  }

  /* CHART TABS */
  .chart-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    overflow-x: auto;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .chart-tabs::-webkit-scrollbar { display: none; }
  .chart-tab {
    flex-shrink: 0;
    padding: 7px 16px;
    border-radius: 30px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: 'Quicksand', sans-serif;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .chart-tab.active { background: var(--grad1); border-color: transparent; color: #fff; box-shadow: 0 2px 12px rgba(255,77,158,0.4); }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 30px 20px;
    color: var(--muted);
    font-size: 13px;
  }
  .empty-icon { font-size: 40px; margin-bottom: 10px; }

  /* PERIOD PHASE BADGE */
  .phase-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 10px;
  }

  /* MOON HERO */
  .moon-hero {
    background: var(--grad5);
    border-radius: var(--radius);
    padding: 28px 20px 22px;
    text-align: center;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
  }
  .moon-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.12), transparent 70%);
  }
  .moon-hero-phase { font-size: 64px; margin-bottom: 6px; filter: drop-shadow(0 0 20px rgba(255,255,255,0.4)); }
  .moon-hero-name { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 22px; color: #fff; margin-bottom: 2px; }
  .moon-hero-date { font-size: 12px; color: rgba(255,255,255,0.7); margin-bottom: 10px; }
  .moon-hero-message { font-size: 13px; color: rgba(255,255,255,0.85); line-height: 1.6; font-style: italic; max-width: 320px; margin: 0 auto; }

  /* PLANET GRID */
  .planet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .planet-tile {
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .planet-icon { font-size: 22px; flex-shrink: 0; }
  .planet-info { flex: 1; min-width: 0; }
  .planet-name { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .planet-sign { font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .planet-retro { font-size: 10px; color: var(--red); font-weight: 700; }
  .planet-loading { text-align: center; padding: 20px; color: var(--muted); font-size: 13px; grid-column: 1/-1; }

  /* RETROGRADE TILES */
  .retro-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .retro-item:last-child { border-bottom: none; }
  .retro-badge {
    background: rgba(248,113,113,0.15);
    border: 1px solid rgba(248,113,113,0.3);
    color: var(--red);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }

  /* HOROSCOPE */
  .horoscope-sign-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    -ms-overflow-style: none;
    scrollbar-width: none;
    margin-bottom: 14px;
  }
  .horoscope-sign-row::-webkit-scrollbar { display: none; }
  .sign-chip {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .sign-chip.active { background: var(--grad3); border-color: transparent; color: #fff; }
  .horoscope-text {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
    padding: 12px;
    background: var(--surface);
    border-radius: var(--radius-sm);
  }

  /* BACKUP REMINDER BANNER */
  .backup-banner {
    display: none;
    margin: 0 0 14px 0;
    border-radius: var(--radius);
    padding: 14px 16px;
    align-items: center;
    gap: 12px;
    border: 1.5px solid;
    animation: fadeIn 0.3s ease;
  }
  .backup-banner.warn {
    background: rgba(255, 210, 63, 0.08);
    border-color: rgba(255, 210, 63, 0.35);
  }
  .backup-banner.danger {
    background: rgba(248, 113, 113, 0.08);
    border-color: rgba(248, 113, 113, 0.35);
  }
